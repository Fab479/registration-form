<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Registration form-->
    <main>
        <div class="hero">
            <!--left side photo and welcome text-->
        <aside class="welcome">
            <h1>welcome</h1>
            <p> Create your free account and start your journey with us today.</p>
            <!--List-->
            <ul>
                <li>Free join</li>
                <li>Learn at your pace</li>
                <li>Join a friendly community</li>
            </ul>
        </aside>
        <section>
            <h1>Create account</h1>
            <p>Fill in your details to register</p>
            <!--form-->
            <form>
                <div class="row">
                    <div class="name">
                    <div class="field">
                    <label for="firstname">Firstname</label>
                    <input type="text" id="firstname" placeholder="Olamide" required>
                    </div>
                    

                    <div class="field">
                        <label for="lastname">Lastname</label>
                        <input type="text" id="lastname" placeholder="Johnson" required>
                    </div>
                    </div>

                    <div class="field">
                        <label for="email">Email:<address></address></label>
                        <input type="email" id="email" placeholder="example@info.ng" required>
                    </div>

                    <div class="field">
                        <label for="phone">Phone number:</label><br>
                        <input type="tel" id="phone" placeholder="08012345678" required>
                    </div>

                    <div class="field">
                        <label for="dob">D.O.B</label><br>
                        <input type="date" id="date" required>
                    </div>

                    <div class="field">
                        <label for="gender">
                            <input type="radio" id="gender">
                            Male
                        </label>
                        <label for="gender">
                            <input type="radio" id="gender">
                            Female
                        </label>
                    </div>
                    <div class="field">
                        <select name="course" id="course">
                            <option value="">Select course</option>
                            <option value="front">Frontend development</option>
                            <option value="back">Backend development</option>
                            <option value="cyber">Cyber Security</option>
                        </select>
                    </div>

                    <div class="field">
                        <input type="checkbox" id="check">
                        <span>I agree to the <a href="term">Terms and Condition</a></span>
                    </div>
                </div>
                <button type="submit">Submit</button>
            </form>
        </section>
        </div>
    </main>
    
</body>
</html>
